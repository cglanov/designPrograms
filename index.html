<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DESIGN DASHBOARD // TERMINAL</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Retro CRT Monospace Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <main class="terminal-frame">
    <header class="banner">
      <h1>DESIGN DASHBOARD</h1>
    </header>

    <div class="status-line" id="status-line">
      &gt; INITIALIZING REMOTE DATA STREAM...<span class="cursor"></span>
    </div>

    <div class="error-box" id="error-box"></div>

    <div class="dashboard-workspace">
      <aside class="sidebar">
        <section class="program-list" id="program-list" aria-label="Design Programs"></section>
      </aside>
      <!-- Ready for future dashboard panels/views -->
      <section class="main-stage" id="main-stage"></section>
    </div>
  </main>
</body>
</html>
