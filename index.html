<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DESIGN PROGRAMS // TERMINAL</title>
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Retro CRT Monospace Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #030804;
      --terminal-bg: #071209;
      --phosphor: #00ff41;
      --phosphor-dim: #008f11;
      --phosphor-glow: rgba(0, 255, 65, 0.45);
      --error-color: #ff3b3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--phosphor);
      font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      display: flex;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      text-shadow: 0 0 6px var(--phosphor-glow);
    }

    /* CRT Scanlines Overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.35) 3px,
        rgba(0, 0, 0, 0.35) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* Subtle CRT Screen Vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.75) 100%);
      pointer-events: none;
      z-index: 998;
    }

    .terminal-frame {
      width: 100%;
      max-width: 860px;
      background: var(--terminal-bg);
      border: 2px solid var(--phosphor);
      box-shadow: 0 0 22px rgba(0, 255, 65, 0.2), inset 0 0 18px rgba(0, 255, 65, 0.08);
      padding: 1.75rem;
      position: relative;
      z-index: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--phosphor-dim);
      border-bottom: 1px dashed var(--phosphor-dim);
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

    /* Banner */
    .banner {
      border: 2px solid var(--phosphor);
      padding: 1.25rem 1rem;
      margin-bottom: 1.5rem;
      text-align: center;
      background: rgba(0, 255, 65, 0.04);
      position: relative;
    }

    .banner-sub {
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      color: var(--phosphor-dim);
      margin-bottom: 0.35rem;
    }

    .banner h1 {
      font-family: 'VT323', monospace;
      font-size: clamp(2.6rem, 7vw, 4.4rem);
      letter-spacing: 0.14em;
      line-height: 1;
      font-weight: 400;
      color: var(--phosphor);
      text-shadow: 0 0 10px var(--phosphor), 0 0 22px var(--phosphor-glow);
    }

    .status-line {
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      min-height: 1.4em;
    }

    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.05em;
      background-color: var(--phosphor);
      vertical-align: text-bottom;
      margin-left: 4px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Program Buttons Grid */
    .program-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .program-btn {
      appearance: none;
      background: rgba(0, 255, 65, 0.03);
      color: var(--phosphor);
      border: 1px solid var(--phosphor);
      padding: 0.95rem 1.1rem;
      font-family: 'VT323', monospace;
      font-size: 1.45rem;
      letter-spacing: 0.05em;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: background-color 0.12s ease, color 0.12s ease, box-shadow 0.12s ease, transform 0.08s ease;
      text-shadow: 0 0 6px var(--phosphor-glow);
    }

    .program-btn:hover,
    .program-btn:focus-visible {
      background-color: var(--phosphor);
      color: var(--bg-color);
      box-shadow: 0 0 16px var(--phosphor);
      text-shadow: none;
      outline: none;
      transform: translateY(-1px);
    }

    .program-btn:active {
      transform: translateY(1px);
    }

    .btn-left {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      overflow: hidden;
    }

    .btn-index {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .btn-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-exec {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .error-box {
      border: 1px solid var(--error-color);
      color: var(--error-color);
      text-shadow: 0 0 6px rgba(255, 59, 59, 0.45);
      padding: 1rem;
      line-height: 1.5;
      display: none;
    }

    footer {
      margin-top: 2rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--phosphor-dim);
      font-size: 0.8rem;
      color: var(--phosphor-dim);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <main class="terminal-frame">
    <div class="top-bar">
      <span>SYS.NODE // GITHUB_PAGES_HOST</span>
      <span>UPLINK: GSHEETS_DB [READ-ONLY]</span>
    </div>

    <header class="banner">
      <div class="banner-sub">*** DIRECTORY INDEX ***</div>
      <h1>DESIGN PROGRAMS</h1>
    </header>

    <div class="status-line" id="status-line">
      &gt; INITIALIZING REMOTE DATA STREAM...<span class="cursor"></span>
    </div>

    <div class="error-box" id="error-box"></div>
    <section class="program-grid" id="program-grid" aria-label="Design Programs"></section>

    <footer>
      <span>CLICK ANY MODULE TO LAUNCH IN NEW TAB</span>
      <span id="record-count">RECORDS: --</span>
    </footer>
  </main>

  <script>
    const SHEET_ID = "1tnzfWk4ywTxh6VATfDt1LI2Ksgl8benu5vJ4K7JJFIM";
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    const statusLine = document.getElementById("status-line");
    const errorBox = document.getElementById("error-box");
    const programGrid = document.getElementById("program-grid");
    const recordCount = document.getElementById("record-count");

    function setStatus(message) {
      statusLine.textContent = `> ${message}`;
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      statusLine.appendChild(cursor);
    }

    function showError(message) {
      setStatus("CONNECTION FAILURE.");
      errorBox.style.display = "block";
      errorBox.textContent = `[ERR] ${message}`;
    }

    function normalizeUrl(rawUrl) {
      if (/^https?:\/\//i.test(rawUrl)) return rawUrl;
      return `https://${rawUrl}`;
    }

    async function loadPrograms() {
      try {
        const response = await fetch(GVIZ_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} while contacting Google Sheets.`);
        }

        const rawText = await response.text();
        const jsonStart = rawText.indexOf("{");
        const jsonEnd = rawText.lastIndexOf("}");

        if (jsonStart === -1 || jsonEnd === -1) {
          throw new Error("Malformed response. Confirm the Google Sheet sharing setting is 'Anyone with the link'.");
        }

        const payload = JSON.parse(rawText.slice(jsonStart, jsonEnd + 1));

        if (payload.status === "error") {
          const detail = payload.errors?.[0]?.detailed_message || "Access denied by spreadsheet.";
          throw new Error(detail);
        }

        const rows = payload.table?.rows || [];
        const programs = [];

        for (const row of rows) {
          if (!row.c) continue;
          const programVal = row.c[0]?.v != null ? String(row.c[0].v).trim() : "";
          const urlVal = row.c[1]?.v != null ? String(row.c[1].v).trim() : "";

          if (!programVal || !urlVal) continue;

          // Skip header row if Google Sheets treats row 1 as data
          if (programVal.toLowerCase() === "program" && urlVal.toLowerCase() === "url") {
            continue;
          }

          programs.push({
            label: programVal,
            url: normalizeUrl(urlVal)
          });
        }

        if (programs.length === 0) {
          setStatus("STREAM COMPLETE. NO ENTRIES FOUND IN COLUMNS A & B.");
          recordCount.textContent = "RECORDS: 00";
          return;
        }

        programs.forEach((item, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "program-btn";
          btn.title = `Open ${item.label} (${item.url})`;

          const leftWrap = document.createElement("span");
          leftWrap.className = "btn-left";

          const indexTag = document.createElement("span");
          indexTag.className = "btn-index";
          indexTag.textContent = `[${String(index + 1).padStart(2, "0")}]`;

          const labelText = document.createElement("span");
          labelText.className = "btn-label";
          labelText.textContent = item.label;

          const execTag = document.createElement("span");
          execTag.className = "btn-exec";
          execTag.textContent = "[↗]";

          leftWrap.append(indexTag, labelText);
          btn.append(leftWrap, execTag);

          btn.addEventListener("click", () => {
            window.open(item.url, "_blank", "noopener,noreferrer");
          });

          programGrid.appendChild(btn);
        });

        setStatus(`READY. ${programs.length} PROGRAM(S) LOADED.`);
        recordCount.textContent = `RECORDS: ${String(programs.length).padStart(2, "0")}`;
      } catch (err) {
        showError(err.message);
      }
    }

    loadPrograms();
  </script>
</body>
</html>
